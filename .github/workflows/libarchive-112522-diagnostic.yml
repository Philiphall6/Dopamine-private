name: libarchive CVE-2026-112522 diagnostic app

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/Libarchive-112522-Diagnostic/**"
      - ".github/workflows/libarchive-112522-diagnostic.yml"

jobs:
  compile:
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Validate V5 ISO controls offline
        run: |
          set -euo pipefail
          python3 tools/Libarchive-112522-Diagnostic/verify_v5_controls.py \
            | tee "$RUNNER_TEMP/libarchive-v5-controls.json"
          if command -v isovfy >/dev/null 2>&1; then
            echo "isovfy is available on the runner"
          else
            echo "isovfy is not installed; dependency-free validation remains required"
          fi

      - name: Select Xcode 26 installation
        run: |
          set -euo pipefail
          selected=""
          for candidate in \
            /Applications/Xcode_26.6.app/Contents/Developer \
            /Applications/Xcode_26.5.1.app/Contents/Developer \
            /Applications/Xcode.app/Contents/Developer; do
            if [[ -d "$candidate" ]]; then
              selected="$candidate"
              break
            fi
          done
          test -n "$selected"
          echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"
          xcodebuild -version
          xcodebuild -showsdks | tee "$RUNNER_TEMP/iphoneos-sdks.txt"
          grep -Eq "iphoneos([0-9.]*)?" "$RUNNER_TEMP/iphoneos-sdks.txt"

      - name: Compile unsigned diagnostic app with installed iPhoneOS SDK
        run: |
          set -euo pipefail
          xcodebuild \
            -project tools/Libarchive-112522-Diagnostic/Libarchive-112522-Diagnostic.xcodeproj \
            -scheme Libarchive-112522-Diagnostic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/libarchive112522-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Stage unsigned app and V5 controls
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/libarchive112522-artifact"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          cp -R "$RUNNER_TEMP/libarchive112522-derived/Build/Products/Release-iphoneos/Libarchive-112522-Diagnostic.app" \
            "$artifact_dir/Libarchive-112522-Diagnostic.app"
          cp -R tools/Libarchive-112522-Diagnostic/Resources/v5-controls \
            "$artifact_dir/v5-controls"

      - name: Upload unsigned app product and V5 controls
        uses: actions/upload-artifact@v4
        with:
          name: libarchive-112522-diagnostic-v5-unsigned
          path: ${{ runner.temp }}/libarchive112522-artifact
