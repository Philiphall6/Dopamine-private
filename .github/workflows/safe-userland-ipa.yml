name: "Dopamine: safe userland diagnostic IPA"

on:
  workflow_dispatch:
  push:
    branches:
      - codex/safe-userland-mapping-v1-20261020

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install ldid
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid

      - name: Install GNU make
        run: |
          brew install make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "/opt/procursus/bin" >> "$GITHUB_PATH"

      - name: Download application resources
        working-directory: Application/Dopamine/Resources
        run: ./download_bootstraps.sh

      - name: Build safe diagnostic IPA
        working-directory: Application
        run: gmake SAFE_DIAGNOSTIC=1

      - name: Verify IPA contents
        run: |
          set -euo pipefail
          test -s Application/Dopamine.ipa
          unzip -t Application/Dopamine.ipa
          unzip -p Application/Dopamine.ipa Payload/Dopamine.app/Info.plist > "$RUNNER_TEMP/Dopamine-Info.plist"
          /usr/libexec/PlistBuddy -c "Print :A15ProbeRevision" "$RUNNER_TEMP/Dopamine-Info.plist"
          /usr/libexec/PlistBuddy -c "Print :A15ProbeSafetyMode" "$RUNNER_TEMP/Dopamine-Info.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-safe-userland-mapping-v1-${{ github.sha }}
          path: Application/Dopamine.ipa
          if-no-files-found: error
          retention-days: 14
